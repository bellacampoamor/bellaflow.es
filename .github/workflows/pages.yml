name: Bouwen en publiceren
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # bellaflow.es: de echte database (Supabase), met inloggen. De publishable key is bedoeld om openbaar te zijn;
      # de database laat alleen ingelogde teamleden toe (RLS met is_team_member()).
      - run: npm run build
        env:
          VITE_DATA_SOURCE: supabase
          VITE_SUPABASE_URL: https://apmyllgfsqofjyowfbxc.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_WyzL-djTNGDMlspPz_4yGA_PlgXmxBJ
      # bellaflow.es/demo/: de voorbeeldversie met verzonnen gegevens in de browser, zoals de site tot nu toe was.
      - run: npx vite build --outDir dist/demo --emptyOutDir
        env:
          VITE_DATA_SOURCE: local
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
